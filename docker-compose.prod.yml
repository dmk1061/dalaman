services:
  dalaman-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dalaman-info-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
      - ./content:/app/content:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
