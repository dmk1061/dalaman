# Изолированная конфигурация Nginx только для dalaman.info
# НЕ затрагивает другие сайты, auth_basic пароли и виртуальные хосты на VPS Contabo.
# Проксирует запросы к Docker-контейнеру dalaman-info-web на 127.0.0.1:3040

server {
    listen 80;
    listen [::]:80;
    server_name dalaman.info www.dalaman.info;

    # Ограничение размера тела запроса
    client_max_body_size 10m;

    # Сжатие текстового контента и статики
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Кеширование иммутабельной статики Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Кеширование оптимизированных изображений из /api/images/
    location /api/images/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Основное проксирование Next.js
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }
}
